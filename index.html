<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2D5B8C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>عارض الموديلات - Middle East</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#2D5B8C;--bg:#e6eaef;--card:#fff;--ink:#1c2633;--mute:#5d6b7c;--line:#d5dbe3;--cut:#d9542e;--hov:#00a3c4;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif;font-size:15px;-webkit-user-select:none;user-select:none}
bdi{unicode-bidi:isolate}
#top{position:absolute;top:0;left:0;right:0;height:52px;background:var(--blue);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:5}
#top .t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .s{font-size:12px;opacity:.8}
#top .grow{flex:1;min-width:0}
#top .badge{font-size:11px;background:rgba(255,255,255,.16);border-radius:20px;padding:3px 9px;white-space:nowrap}
#view{position:absolute;top:52px;left:0;right:0;bottom:calc(64px + var(--safe-b))}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#bar{position:absolute;left:0;right:0;bottom:0;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6}
#bar button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
#bar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#bar button.on{color:var(--blue);font-weight:500}
#bar button.on svg{stroke-width:2.2}
#hint{position:absolute;top:62px;right:10px;left:10px;display:flex;justify-content:center;pointer-events:none;z-index:4}
#hint span{background:rgba(28,38,51,.82);color:#fff;font-size:13px;border-radius:20px;padding:6px 14px;max-width:100%}
#hint span:empty{display:none}
.sheet{position:absolute;left:0;right:0;bottom:calc(64px + var(--safe-b));background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.14);z-index:5;max-height:56vh;display:flex;flex-direction:column;transform:translateY(110%);transition:transform .22s ease}
.sheet.open{transform:none;visibility:visible}
.sheet:not(.open){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font-weight:600}
.sheet .hd .grow{flex:1}
.sheet .bd{overflow:auto;padding:0 14px 12px}
.x{border:0;background:#eef1f5;border-radius:50%;width:30px;height:30px;font-size:18px;line-height:30px;color:var(--mute);cursor:pointer;flex:none}
.row{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:22px;padding:7px 12px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.warn{border-color:var(--cut);color:var(--cut)}
.chip.dis{opacity:.45;pointer-events:none}
.btn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.ghost{background:#eef1f5;color:var(--ink)}
input[type=range]{width:100%;height:30px;accent-color:var(--cut);margin:2px 0}
.fine{display:flex;gap:6px;align-items:center;direction:ltr;justify-content:center}
.fine button{border:1px solid var(--line);background:#fff;border-radius:9px;min-width:44px;height:36px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.fine input{width:110px;height:36px;border:1px solid var(--line);border-radius:9px;text-align:center;font:inherit;font-size:15px;direction:ltr}
.lbl{font-size:13px;color:var(--mute);margin-top:6px}
.big{font-size:22px;font-weight:600;color:var(--ink)}
.parts .p{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eef1f5}
.parts .p .n{flex:1;min-width:0;font-size:14px;cursor:pointer}
.parts .p .n small{display:block;color:var(--mute);font-size:12px}
.parts .p .c{font-size:12px;color:var(--mute);background:#eef1f5;border-radius:10px;padding:2px 8px}
.eye{border:0;background:none;width:34px;height:34px;cursor:pointer;color:var(--blue)}
.eye svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.eye.off{color:#b3bcc8}
#card{position:absolute;left:10px;right:10px;bottom:calc(74px + var(--safe-b));background:var(--card);border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.16);padding:12px 14px;z-index:4;display:none}
#card.show{display:block}
#card .n{font-weight:600;font-size:15px;margin-left:30px}
#card .m{font-size:13px;color:var(--mute);margin-top:3px}
#card .x{position:absolute;top:8px;left:8px}
#card .row{margin-bottom:0}
.tag{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:500;border-radius:8px;padding:3px 8px;pointer-events:none;white-space:nowrap;z-index:3;direction:ltr}
#loading{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;text-align:center;padding:20px}
#loading .bar{width:220px;height:6px;border-radius:3px;background:#cfd6df;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
#loading .msg{color:var(--mute);font-size:14px}
#loading .err{color:#b3261e;font-size:14px;max-width:320px}
/* رسم خط القطع */
#draw{position:absolute;top:52px;left:0;right:0;bottom:calc(64px + var(--safe-b));z-index:4;display:none;touch-action:none;cursor:crosshair}
#draw.on{display:block}
#draw svg{width:100%;height:100%}
/* المؤشر والعدسة */
#cursor{position:absolute;width:0;height:0;z-index:4;pointer-events:none;display:none}
#cursor svg{position:absolute;left:-22px;top:-22px;width:44px;height:44px;overflow:visible}
#curLbl{position:absolute;left:16px;top:-40px;background:rgba(0,120,150,.92);color:#fff;font-size:12.5px;border-radius:8px;padding:3px 8px;white-space:nowrap;direction:rtl}
#curLbl.none{background:rgba(28,38,51,.7)}
#loupe{position:absolute;top:60px;left:8px;width:124px;height:124px;border-radius:6px;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:4;pointer-events:none;display:none}
#loupe::before,#loupe::after{content:"";position:absolute;background:rgba(217,84,46,.9)}
#loupe::before{left:50%;top:30%;bottom:30%;width:1.5px;margin-left:-.75px}
#loupe::after{top:50%;left:30%;right:30%;height:1.5px;margin-top:-.75px}
#mRes{position:absolute;top:60px;right:8px;left:142px;background:rgba(255,255,255,.96);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.18);padding:8px 12px;z-index:4;display:none;font-size:13px;line-height:1.55}
#mRes.show{display:block}
#mRes .big{font-size:20px}
#mRes .r{display:flex;justify-content:space-between;gap:8px}
#mRes .r b{font-weight:500;direction:ltr}
#mRes .ap{color:var(--mute);font-size:11.5px}
/* يد التحكم */
.pad{display:flex;direction:ltr;align-items:center;gap:10px;margin-top:4px}
#joy{width:112px;height:112px;border-radius:50%;background:#eef1f5;border:1px solid var(--line);position:relative;flex:none;touch-action:none}
#joy::after{content:"";position:absolute;inset:34px;border-radius:50%;border:1px dashed #b3bcc8}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--blue);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:1}
#selInfo{flex:1;min-width:0;direction:rtl;text-align:right;font-size:12.5px;line-height:1.5;color:var(--ink)}
#selInfo .s{line-height:1.35;margin-bottom:3px}
#selInfo .muted{color:var(--mute)}
#pickBtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--cut);color:#fff;font:inherit;font-size:17px;font-weight:600;flex:none;cursor:pointer;box-shadow:0 3px 8px rgba(217,84,46,.4);touch-action:none}
#pickBtn:active{transform:scale(.95)}

/* ===== الصفحة الرئيسية والنوافذ ===== */
#backBtn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;width:38px;height:38px;font-size:20px;cursor:pointer;display:none;flex:none}
#home{position:absolute;top:52px;left:0;right:0;bottom:0;overflow:auto;background:var(--bg);padding:14px 12px calc(20px + var(--safe-b));z-index:7;display:none;-webkit-user-select:text;user-select:text}
#home.show{display:block}
.hcard{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(20,40,70,.08);padding:14px;margin:0 auto 12px;max-width:720px}
.hcard h3{margin:0 0 6px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.hcard h3 .grow{flex:1}
.hcard p{margin:4px 0;color:var(--mute);font-size:13.5px;line-height:1.6}
.mrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef1f5;flex-wrap:wrap}
.mrow:last-child{border-bottom:0}
.mrow .nm{flex:1 1 180px;min-width:0}
.mrow .nm b{display:block;font-weight:500;font-size:14.5px;overflow-wrap:anywhere}
.mrow .nm small{color:var(--mute);font-size:12px}
.mrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.sbtn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.sbtn.red{color:#b3261e;border-color:#f0c4c0}
.pill{display:inline-block;font-size:11.5px;border-radius:10px;padding:1px 8px;margin-inline-start:6px;background:#eef1f5;color:var(--mute);font-weight:400}
.pill.lock{background:#fff3e0;color:#9a5b00}.pill.off{background:#fdecea;color:#b3261e}.pill.old{background:#e8f0fe;color:#1a56b0}
.banner{background:#e8f0fe;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dlg{position:absolute;inset:0;background:rgba(15,23,35,.45);z-index:30;display:none;align-items:center;justify-content:center;padding:14px}
.dlg.show{display:flex}
.dlg .box{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:92%;overflow:auto;padding:16px;-webkit-user-select:text;user-select:text}
.dlg h3{margin:0 0 10px;font-size:17px;font-weight:600}
.fld{margin:10px 0}
.fld>label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.fld input[type=text],.fld input[type=password],.fld input[type=file]{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:15px;background:#fff}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.radios input{margin-inline-end:5px}
.dlg .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.err{color:#b3261e;font-size:13px;min-height:18px;margin-top:6px}
.prog{height:8px;background:#e4e9ef;border-radius:4px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
ol.steps{margin:6px 0;padding-inline-start:22px;font-size:14px;line-height:1.9;color:var(--mute)}
ol.steps li.cur{color:var(--ink);font-weight:500}
ol.steps li.ok{color:#1e7a3e}
.qrwrap{text-align:center}
.qrwrap canvas{width:220px;height:auto;border:1px solid var(--line);border-radius:10px}
.linkbox{direction:ltr;text-align:left;font-size:13px;background:#f3f6f9;border-radius:8px;padding:8px;word-break:break-all;margin:8px 0}
#toast{position:absolute;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:rgba(28,38,51,.92);color:#fff;font-size:13.5px;border-radius:20px;padding:8px 16px;z-index:40;display:none;max-width:90%;text-align:center}
#toast.show{display:block}
/* ===== التثبيت كتطبيق ===== */
#instBtn{border:0;background:#fff;color:var(--blue);border-radius:18px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;flex:none;display:none;align-items:center;gap:5px}
#instBtn.show{display:flex}
#instBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inst{background:linear-gradient(160deg,#2D5B8C 0%,#1f456d 100%);color:#fff;position:relative;overflow:hidden}
.inst h3{color:#fff;font-size:17px}
.inst p{color:rgba(255,255,255,.85)}
.inst .x{position:absolute;top:8px;left:8px;border:0;background:rgba(255,255,255,.14);color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer}
.shots{display:flex;gap:10px;justify-content:center;padding:10px 0 6px}
.shots figure{margin:0;flex:1 1 0;min-width:0;max-width:170px;text-align:center}
.shots img{width:100%;height:auto;aspect-ratio:390/844;object-fit:cover;border-radius:12px;border:3px solid #0f2238;box-shadow:0 6px 16px rgba(0,0,0,.28);background:#e6eaef;display:block}
.shots figcaption{font-size:12.5px;margin-top:6px;color:#fff;font-weight:500}
.feats{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.feats li{display:flex;gap:7px;align-items:flex-start;line-height:1.5}
.feats li i{flex:none;width:20px;height:20px;border-radius:50%;background:#d9542e;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;margin-top:1px}
.instGo{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;border:0;border-radius:12px;background:#fff;color:var(--blue);font:inherit;font-size:16px;font-weight:600;min-height:48px;cursor:pointer}
.instGo svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iosHow{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px;line-height:1.7}
.dlg .box.instBox{padding:0;overflow:auto}
.dlg .box.instBox .hcard{margin:0;border-radius:16px}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
</script>
</head>
<body>
<header id="top">
  <button id="backBtn" aria-label="رجوع للصفحة الرئيسية">→</button>
  <div class="grow"><div class="t" id="title">عارض الموديلات</div><div class="s" id="sub">Middle East</div></div>
  <span class="badge" id="cached" hidden>متخزن على الموبايل</span>
  <button id="instBtn" aria-label="ثبّت التطبيق"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>ثبّت</button>
</header>
<div id="view"></div>
<div id="draw"><svg><line id="drawLine" stroke="#d9542e" stroke-width="3" stroke-dasharray="8 6" x1="0" y1="0" x2="0" y2="0"/></svg></div>
<div id="hint"><span id="hintTxt"></span></div>
<div id="tags"></div>
<div id="cursor"><svg viewBox="-22 -22 44 44"><circle r="13" fill="none" stroke="#fff" stroke-width="4"/><circle r="13" fill="none" stroke="#d9542e" stroke-width="2"/><path d="M-21 0h13M8 0h13M0 -21v13M0 8v13" stroke="#fff" stroke-width="4"/><path d="M-21 0h13M8 0h13M0 -21v13M0 8v13" stroke="#d9542e" stroke-width="2"/><circle r="1.6" fill="#d9542e"/></svg><div id="curLbl" class="none"></div></div>
<div id="loupe"></div>
<div id="mRes"></div>
<div id="home"></div>
<div class="dlg" id="dlg"><div class="box" id="dlgBox"></div></div>
<div id="toast"></div>

<div id="card">
  <button class="x" id="cardX" aria-label="قفل">×</button>
  <div class="n" id="cardName"></div>
  <div class="m" id="cardMeta"></div>
  <div class="row">
    <button class="btn ghost" id="cZoom">قرّب عليها</button>
    <button class="btn ghost" id="cAlone">لوحدها</button>
    <button class="btn ghost" id="cFade">شفّف الباقي</button>
    <button class="btn ghost" id="cHide">إخفاء</button>
  </div>
</div>

<section class="sheet" id="sView">
  <div class="hd"><span class="grow">المنظر</span><button class="x" data-close>×</button></div>
  <div class="bd">
    <div class="row">
      <button class="chip" data-view="iso">أيزو</button>
      <button class="chip" data-view="front">أمامي</button>
      <button class="chip" data-view="side">جانبي</button>
      <button class="chip" data-view="top">من فوق</button>
      <button class="chip" data-view="bottom">من تحت</button>
    </div>
    <div class="row"><button class="btn" id="showAll">إظهار كل القطع ورجوع للأول</button></div>
    <div class="lbl">لف بصباع واحد، وقرّب أو بعّد بصباعين، وحرّك بصباعين. ودوس مرتين على أي حتة علشان الموديل يلف حواليها.</div>
  </div>
</section>

<section class="sheet" id="sSection">
  <div class="hd"><span class="grow">قطع سكشن</span><button class="x" data-close>×</button></div>
  <div class="bd">
    <div class="row">
      <button class="chip" data-axis="y">أفقي</button>
      <button class="chip" data-axis="x">رأسي (عرضي)</button>
      <button class="chip" data-axis="z">رأسي (طولي)</button>
      <button class="chip" id="secDraw">ارسم خط القطع</button>
    </div>
    <div class="row">
      <button class="chip" id="secFlip">اقلب الناحية</button>
      <button class="chip dis" id="secToggle">من غير قطع</button>
      <button class="chip warn dis" id="secDel">احذف القطع</button>
    </div>
    <input type="range" id="secSlider" min="0" max="10000" value="5000">
    <div class="fine">
      <button data-step="-10">−10</button><button data-step="-1">−1</button>
      <input id="secNum" type="number" inputmode="decimal" step="any">
      <button data-step="1">+1</button><button data-step="10">+10</button>
    </div>
    <div class="lbl" id="secVal">اختار اتجاه القطع، أو ارسم خط على الموديل.</div>
  </div>
</section>

<section class="sheet" id="sMeasure">
  <div class="hd"><span class="grow">القياس</span><button class="chip" id="mClear">امسح</button><button class="x" data-close>×</button></div>
  <div class="bd">
    <div class="row" style="margin-top:2px">
      <button class="chip on" data-snap="auto">تلقائي</button>
      <button class="chip" data-snap="point">نقطة</button>
      <button class="chip" data-snap="edge">حرف / خط</button>
      <button class="chip" data-snap="face">سطح</button>
    </div>
    <div class="pad">
      <div id="joy"><div id="knob"></div></div>
      <div id="selInfo"></div>
      <button id="pickBtn">حدد</button>
    </div>
  </div>
</section>

<section class="sheet" id="sParts">
  <div class="hd"><span class="grow">القطع <small id="partsCount" style="color:var(--mute);font-weight:400"></small></span><button class="x" data-close>×</button></div>
  <div class="bd parts" id="partsList"></div>
</section>

<nav id="bar">
  <button data-sheet="sView"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>المنظر</button>
  <button data-sheet="sSection"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4-8 4z"/><path d="M4 8v8l8 4 8-4V8"/><path d="M2 13h20" stroke-dasharray="2 2"/></svg>سكشن</button>
  <button data-sheet="sMeasure"><svg viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6 8v3M9 8v4M12 8v3M15 8v4M18 8v3"/></svg>قياس</button>

// ---------------------------------------------------------------- فتح موديل بالكود
async function openModel(id) {
  if (!validId(id)) return fail('اللينك ده مش صحيح.');
  loadingMsg('بيتأكد من الموديل...', 3);
  const I = localIdx(), e = I[id], toks = LS.get('me_toks', {});
  let meta;
  try { meta = await api({ fn: 'meta', id, tok: toks[id], etok: engTok() }, 15000); }
  catch (err) {
    const bytes = e ? await cacheGet(id) : null;
    if (bytes && Date.now() - (e.lastOk || 0) < OFFLINE_DAYS * 864e5) { toast('مفيش نت: فاتح النسخة اللي على الموبايل'); return loadBytes(bytes, e); }
    return fail(bytes ? 'عدّى أكتر من ' + OFFLINE_DAYS + ' أيام والموبايل ما شافش نت. شغّل النت مرة علشان نتأكد إن الموديل لسه متاح، وبعدها يفتح عادي.' : 'محتاج نت علشان الموديل ينزل أول مرة.');
  }
  if (meta.gone) { await forget(id); return fail('الموديل ده اتقفل أو اتشال من السيستم. لو محتاجه كلّم المهندس.'); }
  if (meta.need === 'pw') {
    await cacheDel(id); delete toks[id]; LS.set('me_toks', toks);
    const tok = await askModelPw(id, meta.name, !!(e && e.ver));
    if (!tok) { location.href = BASE; return; }
    toks[id] = tok; LS.set('me_toks', toks); return openModel(id);
  }
  if (!meta.ok) return fail('حصلت مشكلة في السيرفر: ' + (meta.err || ''));
  let bytes = e && e.ver === meta.ver ? await cacheGet(id) : null;
  if (!bytes) {
    try { bytes = await downloadModel(id, meta, toks[id]); }
    catch (err) { if (err.message === 'changed') return openModel(id); return fail(err instanceof Offline ? 'النت فصل وهو بينزّل الموديل. جرّب تاني.' : 'حصلت مشكلة وهو بينزّل الموديل: ' + err.message); }
    const ok = await cachePut(id, bytes);
    if (!ok) toast('الموديل اتفتح، بس مش هيتخزن على الموبايل ده (لازم https)');
  }
  I[id] = { name: meta.name, ver: meta.ver, size: bytes.length, fmt: meta.fmt, lastOk: Date.now(), opened: Date.now() };
  LS.set('me_models', I);
  loadBytes(bytes, I[id]);
}
async function downloadModel(id, meta, tok) {
  const parts = [];
  for (let i = 0; i < meta.parts; i++) {
    loadingMsg('بينزّل الموديل: جزء ' + (i + 1) + ' من ' + meta.parts + ' (' + MB(meta.size) + ')', 5 + 90 * i / meta.parts);
    let r, tries = 0;
    for (;;) { try { r = await api({ fn: 'part', id, i, tok, etok: engTok(), ver: meta.ver }, 120000); break; } catch (e) { if (++tries >= 3) throw e; await new Promise(z => setTimeout(z, 1500)); } }
    if (r.err === 'changed') throw new Error('changed');
    if (!r.ok) throw new Error(r.err || r.need || 'part');
    parts.push(await b64ToBytes(r.b64));
  }
  loadingMsg('بيفك الموديل...', 97);
  return joinParts(parts);
}
async function loadBytes(bytes, entry) {
  modelTitle = entry && entry.name || '';
  loadingMsg('بيفك الموديل...', 98);
  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  const buf = bytes.byteOffset === 0 && bytes.byteLength === bytes.buffer.byteLength ? bytes.buffer : bytes.slice().buffer;
  const gltf = await loader.parseAsync(buf, '');
  setupModel(gltf);
  $('loading').remove();
  const fmt = +(gltf.parser.json.scenes?.[0]?.extras?.meta || 0);
  if (fmt === 2) toast('الموديل ده معمول قبل قياس الشفة والكون وخطوط التماس. باقي القياس شغال، والمهندس يقدر يحدّثه من صفحته.', 6000);
  else if (fmt < 3) toast('الموديل ده معمول بنسخة قديمة. العرض شغال، بس القياس المضبوط محتاج المهندس يحدّثه.', 6000);
  else { hint('دوس على أي قطعة علشان تعرف اسمها'); setTimeout(() => { if (mode === 'view' && !$('draw').classList.contains('on')) hint(''); }, 5000); }
  window.__viewer = { THREE, scene, camera, controls, parts, groups, bodyMeshes, probe, pair, single, req, renderer, cur, placeCursor, getSel: () => sel, getHover: () => hoverEnt, contours: () => contours, getCut: () => cut, setCut: (c, a) => { cut = c; cutActive = a; applyCut(); }, computeContours, openSheet, cacheOf, faceEnt, buildDraw, batches, renderItems, drawRoot };
}

function convertInWorker(bytes, title, source, onLog) {
  return new Promise((res, rej) => {
    const w = new Worker('conv/convert-worker.js');
    w.onmessage = e => {
      const d = e.data;
      if (d.type === 'log') onLog && onLog(d.stage, d.info);
      else if (d.type === 'done') { w.terminate(); res(d); }
      else if (d.type === 'error') { w.terminate(); rej(new Error('التحويل: ' + d.message)); }
    };
    w.onerror = e => { w.terminate(); rej(new Error('التحويل: ' + (e.message || 'worker'))); };
    w.postMessage({ bytes, title, source }, [bytes.buffer]);
  });
}
async function uploadBytes(bytes, kind, onPart) {
  const ids = [], n = Math.max(1, Math.ceil(bytes.length / CHUNK));
  for (let i = 0; i < n; i++) {
    const b64 = await bytesToB64(bytes.subarray(i * CHUNK, Math.min(bytes.length, (i + 1) * CHUNK)));
    let r, tries = 0;
    for (;;) { try { r = await engCall({ fn: 'up', kind, b64 }, 180000); break; } catch (e) { if (e.message === 'auth' || ++tries >= 3) throw e; await new Promise(z => setTimeout(z, 2000)); } }
    ids.push(r.fileId); onPart && onPart(i + 1, n);
  }
  return ids;
}
// ---------------------------------------------------------------- شريط التقدم
// set() = قيمة حقيقية (خطوة خلصت)، و creep() = بيزحف بالراحة ناحية هدف في الخطوات الطويلة اللي مالهاش عدّاد،
// علشان الشريط مايقفش أبداً والمستخدم مايحسش إن البرنامج علّق. عمره ما بيرجع لورا.
function progBar(el) {
  let cur = 0, tgt = 0, tau = 1;
  const draw = () => { el.style.width = cur.toFixed(1) + '%'; };
  const tm = setInterval(() => { if (!el.isConnected) return clearInterval(tm); if (cur < tgt - 0.05) { cur += (tgt - cur) * (1 - Math.exp(-0.25 / tau)); draw(); } }, 250);
  return {
    set(p) { cur = Math.max(cur, Math.min(100, p)); tgt = Math.max(tgt, cur); draw(); },
    creep(to, sec) { tgt = Math.max(cur, Math.min(100, to)); tau = Math.max(0.4, sec / 2.5); },
    stop() { clearInterval(tm); },
  };
}
// التحويل جوه الـ worker: رسايله بتحرّك الشريط بين a و b (القراية، وبعدين كل قطعة حسب حجمها، وبعدين الضغط)
function convProg(P, a, b, stepBytes, say) {
  const mb = stepBytes / 1e6, at = f => a + (b - a) * f;
  // القراية (occt) هي أطول خطوة ومالهاش عدّاد: على لوسافر 33 ميجا خدت ~45 ثانية، فالتقدير 1.5 ثانية لكل ميجا
  P.creep(at(0.55), 5 + mb * 1.5); say('بيقرا ملف الـ STEP (أطول خطوة)');
  return (stage, info) => {
    if (stage === 'read') { P.set(at(0.55)); P.creep(at(0.58), 3); say('بيحلل القطع: 0 من ' + info.bodies); }
    else if (stage === 'body') { const f = Math.min(1, info.f || 0); P.set(at(0.55 + 0.37 * f)); P.creep(at(0.55 + 0.37 * Math.min(1, f + 0.05)), 4); say('بيحلل القطع: ' + info.i + ' من ' + info.n); }
    else if (stage === 'analysed') { P.set(at(0.92)); P.creep(at(0.99), 2 + mb * 0.3); say('بيضغط الموديل'); }
    else if (stage === 'done') P.set(at(1));
  };
}
const PART_SEC = 6;   // تقدير: رفع أو تنزيل جزء 4 ميجا من جوجل

async function publishStep({ file, name, pw, id, onStep, P }) {
  onStep(0); P.set(1); P.creep(4, 1 + file.size / 50e6);
  const step = new Uint8Array(await file.arrayBuffer());
  onStep(1);
  const t0 = Date.now();
  const conv = await convertInWorker(step.slice(), name, file.name, convProg(P, 4, 62, step.length, t => onStep(1, 'بيحوّل الموديل: ' + t)));
  onStep(2, 'بيضغط الـ STEP الأصلي'); P.set(62); P.creep(65, 1 + step.length / 20e6);
  const stepGz = await gz(step);
  const total = Math.ceil(conv.glb.length / CHUNK) + Math.ceil(stepGz.length / CHUNK); let done = 0;
  const at = k => 65 + 32 * k / total;
  const tick = () => { done++; P.set(at(done)); if (done < total) P.creep(at(done + 1), PART_SEC); onStep(3, 'بيرفع: ' + done + ' من ' + total + ' (' + MB(conv.glb.length + stepGz.length) + ')'); };
  onStep(3, 'بيرفع: 0 من ' + total + ' (' + MB(conv.glb.length + stepGz.length) + ')'); P.set(65); P.creep(at(1), PART_SEC);
  const glbParts = await uploadBytes(conv.glb, 'glb', tick);
  const stepParts = await uploadBytes(stepGz, 'step', tick);
  onStep(4); P.set(97); P.creep(99.5, 4);
  const r = await engCall({ fn: 'publish', id: id || undefined, name, pw, glbParts, glbSize: conv.glb.length, stepParts, stepSize: step.length, stepName: file.name, fmt: conv.fmt, stats: Object.assign({}, conv.stats, { convertMs: Date.now() - t0 }) });
  onStep(5); P.set(100);
  return r.model;
}

// ---------------------------------------------------------------- اللينك والـ QR
function qrCanvas(text, caption) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), cell = Math.floor(560 / (n + 8)), size = cell * (n + 8), capH = caption ? 120 : 0;
  const c = document.createElement('canvas'); c.width = size; c.height = size + capH;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect((k + 4) * cell, (r + 4) * cell, cell, cell);
  if (caption) {
    g.direction = 'rtl'; g.textAlign = 'center'; g.fillStyle = '#1c2633';
    g.font = '600 30px "Readex Pro", sans-serif'; g.fillText(caption.slice(0, 40), size / 2, size + 30);
    g.font = '22px "Readex Pro", sans-serif'; g.fillStyle = '#5d6b7c'; g.fillText('صوّر الكود علشان تفتح الموديل', size / 2, size + 72);
  }
  return c;
}

// ---------------------------------------------------------------- تحديث الموديلات القديمة (بعد أي تغيير في الأساس)
async function reconvertAll() {
  const list = (engModels || []).filter(m => m.fmt < APP_FMT && m.stepParts > 0);
  if (!list.length) return;

    const m = list[k], a = 100 * k / list.length, w = 100 / list.length, at = f => a + w * f;

  b.querySelector('#rcErr').innerHTML = errs.map(esc).join('<br>');
  b.querySelector('#rcBtns').style.display = 'flex'; b.querySelector('#rcOk').onclick = () => { closeDialog(); loadEngList(); };
}

const parts = [], groups = [], bodyMeshes = [];

function setupModel(gltf) {

  const title = modelTitle || gltf.parser.json.scenes?.[0]?.extras?.title || 'موديل';
  $('title').innerHTML = '<bdi>' + esc(title) + '</bdi>';
  document.title = title + ' - عارض Middle East';

  const jsonNodes = gltf.parser.json.nodes || [];

    // الأوبجكتات اللي جاية من الملف كلها مخفية: القطعة الأصلية للّمس والقياس والسكشن، والرسم كله من drawRoot (buildDraw)

// ================================================================ الكاميرا
function frame(box, dir) {
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2 || 1;
  const d = dir || camera.position.clone().sub(controls.target).normalize();
  // المسافة اللي تخلّي أركان الصندوق التمانية جوه الشاشة بالطول وبالعرض (الموبايل الواقف ضيّق، فالعرض هو اللي بيحكم غالباً)

  const tV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), tH = tV * camera.aspect;
  let dist = 0; const p = new THREE.Vector3();
  for (let i = 0; i < 8; i++) {
    p.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).sub(c);
    const z = p.dot(d); dist = Math.max(dist, z + Math.abs(p.dot(right)) / tH, z + Math.abs(p.dot(up)) / tV);
  }
  dist = (dist || r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.08;

  controls.update(); req();
}

// ================================================================ السكشن

document.querySelectorAll('[data-axis]').forEach(b => b.onclick = () => newAxisCut(b.dataset.axis));

// شكل المستوى بيظهر ثانية لما القطع يتحرك
const planeVis = new THREE.Group(); planeVis.visible = false; scene.add(planeVis);
let planeTimer = 0;
function flashPlane() {
  if (!cut) return;
  planeVis.clear();
  const size = modelSize * 0.8, c = modelBox.getCenter(new THREE.Vector3());
  const pos = c.clone().addScaledVector(cut.d, cut.s - cut.d.dot(c));
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), cut.d);
  const pg = new THREE.PlaneGeometry(size, size);
  const m = new THREE.Mesh(pg, new THREE.MeshBasicMaterial({ color: 0xd9542e, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false }));
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(pg), new THREE.LineBasicMaterial({ color: 0xd9542e }));
  [m, l].forEach(o => { o.quaternion.copy(q); o.position.copy(pos); planeVis.add(o); });
  planeVis.visible = true; clearTimeout(planeTimer); planeTimer = setTimeout(() => { planeVis.visible = false; req(); }, 1300); req();
}

// ارسم خط القطع: المستوى اللي بيعدي على الكاميرا وعلى الخط اللي اترسم (يعني عمودي على الشاشة)
let drawStart = null;
$('secDraw').onclick = () => { $('draw').classList.add('on'); hint('ارسم خط بصباعك على الموديل. التانك هيتقطع على الخط ده'); };
const dl = $('drawLine');
$('draw').addEventListener('pointerdown', e => { const r = $('draw').getBoundingClientRect(); drawStart = [e.clientX - r.left, e.clientY - r.top]; dl.setAttribute('x1', drawStart[0]); dl.setAttribute('y1', drawStart[1]); dl.setAttribute('x2', drawStart[0]); dl.setAttribute('y2', drawStart[1]); $('draw').setPointerCapture(e.pointerId); });
const drawEnd = e => { const r = $('draw').getBoundingClientRect(); let x = e.clientX - r.left, y = e.clientY - r.top;
  // لو الخط قريب من أفقي أو رأسي على الشاشة (أقل من 4 درجات) بيتعدل لوحده
  const a = Math.atan2(y - drawStart[1], x - drawStart[0]) * 180 / Math.PI, m = ((a % 90) + 90) % 90;
  if (m < 4 || m > 86) { if (Math.abs(x - drawStart[0]) > Math.abs(y - drawStart[1])) y = drawStart[1]; else x = drawStart[0]; }

$('draw').addEventListener('pointermove', e => { if (!drawStart) return; const [x, y] = drawEnd(e); dl.setAttribute('x2', x); dl.setAttribute('y2', y); });
$('draw').addEventListener('pointerup', e => {
  if (!drawStart) return; const [x, y] = drawEnd(e), s0 = drawStart; drawStart = null;
  $('draw').classList.remove('on'); dl.setAttribute('x2', dl.getAttribute('x1')); dl.setAttribute('y2', dl.getAttribute('y1')); hint('');

  ['cursor', 'loupe'].forEach(k => $(k).style.display = m ? 'block' : 'none');
  if (m && was !== 'measure') {
    select(null); hint('');
    // المؤشر في نص الجزء اللي باين من الشاشة (فوق الشيت)
    requestAnimationFrame(() => { const sh = $('sMeasure').getBoundingClientRect(), vr = view.getBoundingClientRect(); cur.x = VW / 2; cur.y = Math.max(60, (sh.top - vr.top) / 2); placeCursor(); });
    renderSel();
  }
  if (!m && was === 'measure') { clearGroup(hovGroup); hoverEnt = null; $('mRes').classList.remove('show'); clearGroup(selGroup); tags.forEach(t => t.el.remove()); tags = []; }
  if (id) $('card').classList.remove('show');
  if (id !== 'sSection') { $('draw').classList.remove('on'); }
  needRender = true;
}
document.querySelectorAll('#bar button').forEach(b => b.onclick = () => openSheet(b.classList.contains('on') ? null : b.dataset.sheet));
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => openSheet(null));

// ================================================================ الرسم
const loupeCam = new THREE.PerspectiveCamera();
const LOUPE = 124, ZOOM = 4;
// ================================================================ الجودة وقت الحركة
// وانت بتلف أو تقرّب: التفاصيل المسموحة لحد بكسل واحد (بدل نص)، ولو الموبايل مابيلحقش (الرسمة أبطأ من 30 مللي)
// دقة الشاشة بتنزل خطوة خطوة. أول ما الحركة تقف بـ 0.2 ثانية: رسمة كاملة بأعلى جودة. يعني الصورة الواقفة دايماً بأعلى جودة،
// والحركة دايماً ناعمة. والقياس مالوش دعوة بده (من الأرقام المضبوطة).
const DPR_HI = Math.min(devicePixelRatio, 2), DPR_STEPS = [DPR_HI, Math.min(DPR_HI, 1.5), Math.min(DPR_HI, 1), Math.min(DPR_HI, 0.75)];
let lastMove = 0, moving = false, dprStep = 0, frameEma = 16, lastFrame = 0;
// آخر حركة "بتبان": الحركة الناعمة في آخرها بتبقى أجزاء من البكسل، دي مانعتبرهاش حركة علشان الجودة الكاملة ترجع على طول
const _lastCam = new THREE.Vector3(), _lastTgt = new THREE.Vector3();
controls.addEventListener('change', () => {
  const d = Math.max(1e-9, camera.position.distanceTo(controls.target));
  const rel = (camera.position.distanceTo(_lastCam) + controls.target.distanceTo(_lastTgt)) / d;
  _lastCam.copy(camera.position); _lastTgt.copy(controls.target);
  if (rel > 1e-3) lastMove = performance.now();
});
function qualityTick(now) {
  const was = moving; moving = now - lastMove < 200;
  if (moving) {
    if (lastFrame && now - lastFrame < 500) frameEma = frameEma * 0.8 + (now - lastFrame) * 0.2;
    lastFrame = now; drawTau = 1;
    if (frameEma > 30 && dprStep < DPR_STEPS.length - 1 && DPR_STEPS[dprStep + 1] < DPR_STEPS[dprStep]) { dprStep++; frameEma = 20; renderer.setPixelRatio(DPR_STEPS[dprStep]); }
  } else if (was) {
    lastFrame = 0; drawTau = 0.5; if (dprStep) { dprStep = 0; renderer.setPixelRatio(DPR_HI); } req();
  }
}

function loop(now) {
  requestAnimationFrame(loop);
  controls.update();   // الحركة الناعمة (damping) بتكمّل شوية بعد ما تشيل صباعك
  qualityTick(now);
  stepJoy(now);
  if (mode === 'measure' && hoverDirty && now - lastProbe > 45) { hoverDirty = false; lastProbe = now; updateHover(); }
  if (!needRender) return; needRender = false;
  // نقط التحديد: نص قطرها 5 بكسل على الشاشة مهما كان بعدها (مش مربوطة بحجم الموديل)
  const k1 = pixW(1) * 5;
  [hovGroup, selGroup].forEach(g => g.children.forEach(o => { if (o.userData.dot) o.scale.setScalar(Math.max(camera.near, o.position.distanceTo(camera.position)) * k1); }));
  renderer.setScissorTest(false); renderer.setViewport(0, 0, VW, VH);
  buildDraw(camera, 1);
  renderer.render(scene, camera);
  if (mode === 'measure') {
    // العدسة: نفس الكاميرا بس مكبّرة 4 مرات حوالين المؤشر
    loupeCam.copy(camera); const w = LOUPE / ZOOM;
    loupeCam.setViewOffset(VW, VH, cur.x - w / 2, cur.y - w / 2, w, w); loupeCam.updateProjectionMatrix();
    buildDraw(loupeCam, ZOOM);   // العدسة: اللي جوه مربعها الصغير بس، وبتفاصيل أكتر لأنها مكبّرة
    const dots = []; [hovGroup, selGroup].forEach(g => g.children.forEach(o => { if (o.userData.dot) { dots.push(o); o.scale.multiplyScalar(1 / ZOOM); } }));
    const lr = $('loupe').getBoundingClientRect(), vr = view.getBoundingClientRect();
    const lx = lr.left - vr.left + 3, ly = VH - (lr.top - vr.top + 3) - (LOUPE - 6);
    renderer.setScissorTest(true); renderer.setScissor(lx, ly, LOUPE - 6, LOUPE - 6); renderer.setViewport(lx, ly, LOUPE - 6, LOUPE - 6);
    renderer.render(scene, loupeCam);
    dots.forEach(o => o.scale.multiplyScalar(ZOOM));
    renderer.setScissorTest(false); renderer.setViewport(0, 0, VW, VH);
  }
  const v = new THREE.Vector3();
  tags.forEach(t => { v.copy(t.pos).project(camera); t.el.style.display = v.z < 1 ? '' : 'none'; t.el.style.left = ((v.x + 1) / 2 * VW) + 'px'; t.el.style.top = ((1 - v.y) / 2 * VH + 52) + 'px'; });
}

// ================================================================ تشغيل
$('backBtn').onclick = () => { location.href = BASE; };
// للتجربة على الجهاز بس: الوصول لدوال القياس من سكريبت الاختبار
if (location.hostname === 'localhost') window.__dbg = { bodyMeshes, cacheOf, faceEnt, edgeEnt, single, pair, entLabel, contourEnt, computeContours, get contours() { return contours; },
  cutAt(d, s) { cut = { d: new THREE.Vector3(...d).normalize(), s, kind: 'line', flip: false }; cutActive = true; applyCut(); computeContours(); } };
(async () => {
  resize(); requestAnimationFrame(loop); instRefresh();
  const p = params.get('p'), m = params.get('m');
  tidyCache();
  try {
    if (p) { $('backBtn').style.display = 'block'; await openModel(p); }
    else if (m) {   // للتجربة على الجهاز: ?m=../models/x.glb
      $('backBtn').style.display = 'block';
      const r = await fetch(m, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status);
      await loadBytes(new Uint8Array(await r.arrayBuffer()), null);
    } else await showHome();
  } catch (err) {
    console.error(err);
    fail('الموديل ما اتفتحش: ' + (err.message || err));
  }
  // التطبيق بيتحدّث لوحده: الصفحة بتتجاب من النت الأول، ولما نسخة جديدة توصل بيعمل reload
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    let had = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloading) { reloading = true; location.reload(); } had = true; });
    navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
  }
})();
</script>
